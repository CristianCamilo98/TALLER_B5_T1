# Contrato de datos compartido — Taller B5-T1
# Congelado para que Marco / Cristian / Dani partan del mismo artefacto.
# Cambios solo con acuerdo explícito del equipo (bump de data_version).

data_version: "0.1.0"
source: yfinance
auto_adjust: true   # precios ajustados por splits/dividendos (recomendado para returns)

universe:
  target: NVDA
  # MRVL = Marvell (el ticker "MRVC" del borrador no es el semiconductor cotizado habitual)
  donors:
    - AMD
    - INTC
    - QCOM
    - AVGO
    - MU
    - TXN
    - ADI
    - MCHP
    - MRVL
    - NXPI

calendar:
  start: "2012-01-03"
  end: "2025-12-31"
  # Sesiones: unión de fechas con dato válido en al menos un ticker;
  # luego se exige cobertura mínima por fila (ver cleaning).

columns_raw:
  - Open
  - High
  - Low
  - Close
  - Volume

cleaning:
  # Eliminar filas con NaN en Open/High/Low/Close (Volume 0 se permite solo si OHLC válido; ver script)
  drop_rows_with_nan_ohlc: true
  # Descartar días con High < Low o Close/Open fuera de [Low, High] (tras ajuste, raro pero posible)
  enforce_ohlc_invariants: true
  # Un ticker se mantiene en el panel solo si tiene al menos este % de sesiones del calendario común
  min_ticker_coverage: 0.95
  # Tras alinear, no rellenar precios hacia adelante (evita inventar sesiones).
  # Los huecos puntuales se eliminan a nivel de (date, ticker).
  no_price_ffill: true

outputs:
  panel_parquet: "data/processed/ohlcv_panel.parquet"
  panel_csv: "data/processed/ohlcv_panel.csv"
  manifest: "data/processed/manifest.json"
  checksums: "data/processed/checksums.sha256"
